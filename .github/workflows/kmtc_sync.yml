name: KMTC 스케줄 동기화

on:
  schedule:
    # 매시간 매일 KST (UTC -9). 매일 08~19시 KST
    - cron: "0 23 * * *"     # KST 08:00
    - cron: "0 0 * * *"      # KST 09:00
    - cron: "0 1 * * *"      # KST 10:00
    - cron: "0 2 * * *"      # KST 11:00
    - cron: "0 3 * * *"      # KST 12:00
    - cron: "0 4 * * *"      # KST 13:00
    - cron: "0 5 * * *"      # KST 14:00
    - cron: "0 6 * * *"      # KST 15:00
    - cron: "0 7 * * *"      # KST 16:00
    - cron: "0 8 * * *"      # KST 17:00
    - cron: "0 9 * * *"      # KST 18:00
    - cron: "0 10 * * *"     # KST 19:00
  workflow_dispatch:

jobs:
  kmtc-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run kmtc_sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DS_ID: ${{ secrets.NOTION_DS_ID }}
          KMTC_PROXY_URL: ${{ secrets.KMTC_PROXY_URL }}
          PYTHONIOENCODING: utf-8
        run: |
          python scripts/kmtc_sync.py
