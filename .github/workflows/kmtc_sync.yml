name: KMTC 스케줄 동기화

on:
  schedule:
    # 평일(월~금) KST 08:00 ~ 19:00, 30분 간격 (하루 23회)
    # KST = UTC + 9 → KST 08:00/08:30 = UTC 전날 23:00/23:30 (일~목)
    - cron: "0,30 23 * * 0-4"    # KST 08:00, 08:30 (월~금)
    - cron: "0,30 0-9 * * 1-5"   # KST 09:00 ~ 18:30 (월~금)
    - cron: "0 10 * * 1-5"       # KST 19:00 (월~금)
    # 주말(토·일) KST 9회: 08:00 / 09:15 / 10:45 / 12:00 / 13:15 / 14:45 / 16:15 / 17:45 / 19:00
    - cron: "0 23 * * 5,6"       # KST 08:00 (토·일)
    - cron: "15 0 * * 6,0"       # KST 09:15
    - cron: "45 1 * * 6,0"       # KST 10:45
    - cron: "0 3 * * 6,0"        # KST 12:00
    - cron: "15 4 * * 6,0"       # KST 13:15
    - cron: "45 5 * * 6,0"       # KST 14:45
    - cron: "15 7 * * 6,0"       # KST 16:15
    - cron: "45 8 * * 6,0"       # KST 17:45
    - cron: "0 10 * * 6,0"       # KST 19:00
  workflow_dispatch:

jobs:
  kmtc-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run kmtc_sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DS_ID: ${{ secrets.NOTION_DS_ID }}
          KMTC_PROXY_URL: ${{ secrets.KMTC_PROXY_URL }}
          PROXY_TOKEN: ${{ secrets.PROXY_TOKEN }}
          PYTHONIOENCODING: utf-8
        run: |
          python scripts/kmtc_sync.py
