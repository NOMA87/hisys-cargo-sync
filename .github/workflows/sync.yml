name: 유니패스 차수 동기화

on:
  schedule:
    # KST 평일 08:00 / 09:15 / 10:45 / 12:00 / 13:15 / 14:45 / 16:15 / 17:45 / 19:00  (9회/일)
    # KST 08:00 = UTC 전날 23:00 → 일~목 (0-4)
    - cron: "0 23 * * *"     # KST 08:00  출근 전 (야간 진행 미리 확인)
    - cron: "15 0 * * *"     # KST 09:15  출근 직후
    - cron: "45 1 * * *"     # KST 10:45  오전 마무리
    - cron: "0 3 * * *"      # KST 12:00  점심 직전 (오전 마지막 점검)
    - cron: "15 4 * * *"     # KST 13:15  점심 후 복귀
    - cron: "45 5 * * *"     # KST 14:45  오후 중반
    - cron: "15 7 * * *"     # KST 16:15
    - cron: "45 8 * * *"     # KST 17:45  퇴근 직전 최종 확인
    - cron: "0 10 * * *"     # KST 19:00  퇴근 후 1시간 (늦은 진행 캐치)
  workflow_dispatch:  # 수동 실행
    inputs:
      backfill:
        description: 'Backfill 모드 (모든 수입 차수 대상, 반입/반출시간만 채움)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run sync_runner
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DS_ID: ${{ secrets.NOTION_DS_ID }}
          UNIPASS_PROXY_URL: ${{ secrets.UNIPASS_PROXY_URL }}
          PROXY_TOKEN: ${{ secrets.PROXY_TOKEN }}
          HJIT_PROXY_URL: ${{ secrets.HJIT_PROXY_URL }}
          KMTC_PROXY_URL: ${{ secrets.KMTC_PROXY_URL }}
          SNCT_PROXY_URL: ${{ secrets.SNCT_PROXY_URL }}
          PYTHONIOENCODING: utf-8
          BACKFILL: ${{ inputs.backfill }}
        run: |
          python scripts/sync_runner.py
